wallpaper {
    monitor = eDP-1
    path = @HOME@/.wallpapers/selected-wallpaper.png
    fit_mode = cover
}

# Use the same wallpaper on the external HDMI display.  The display profile
# script decides which output is enabled.
wallpaper {
    monitor = HDMI-A-1
    path = @HOME@/.wallpapers/selected-wallpaper.png
    fit_mode = cover
}

splash = false
